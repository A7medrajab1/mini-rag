services:
  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db
    
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    
    networks:
      - backend
volumes:
  mongodb_data:
networks:
  backend: