[project]
name = "mini-rag"
version = "0.1.0"
description = "Production-oriented Retrieval-Augmented Generation (RAG) application"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.52.4,<0.53",
    "pydantic-settings>=2.15.0,<2.16",
    "python-multipart>=0.0.32,<0.1",
    "aiofiles",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.6,<0.17",
]